<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>オルゴール譜 — 楽譜エディター</title>
  <meta name="description" content="MIDI・TXTを取り込み、30音オルゴールの楽譜をマス目で編集。試聴してTXT・MIDI・MP3・OGGで保存できます。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23163e57'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h16' stroke='%23ffffff' stroke-width='2'/%3E%3Crect x='10' y='6' width='5' height='6' fill='%2391d8f6'/%3E%3Crect x='19' y='13' width='5' height='6' fill='%2391d8f6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=2a25a6e0b788d836">
</head>
<body>
  <main>
      <section class="editor" id="dropZone" aria-label="楽譜エディター" data-i18n-label="楽譜エディター">
        <div class="editor-heading"><h1><input id="scoreTitle" type="text" value="新しい楽譜" aria-label="曲名" data-i18n-label="曲名" title="曲名を編集" data-i18n-title="曲名を編集" maxlength="100" autocomplete="off" spellcheck="false"></h1><div class="heading-actions"><select id="templateSelect" aria-label="曲を選ぶ" data-i18n-label="曲を選ぶ"><option value="" data-i18n="曲を選ぶ">曲を選ぶ</option></select><button id="pickFile" class="button" title="MIDI・TXTを読み込む" data-i18n-title="MIDI・TXTを読み込む" data-i18n="読み込む">読み込む</button><input id="fileInput" type="file" accept=".mid,.midi,.txt,audio/midi,audio/x-midi,text/plain" hidden><button id="reset" class="button subtle" title="空の楽譜に戻す" data-i18n-title="空の楽譜に戻す" data-i18n="リセット">リセット</button></div></div>
        <div class="toolbar">
          <div class="playback-actions"><button id="play" class="button primary" aria-label="試聴" data-i18n-label="試聴" title="試聴" data-i18n-title="試聴" aria-pressed="false">▶</button><button id="loop" class="button" aria-label="ループ再生" data-i18n-label="ループ再生" title="ループ再生" data-i18n-title="ループ再生" aria-pressed="false">↻</button></div>
          <label><input id="bpm" type="number" min="1" step="1" value="120" aria-label="テンポ" data-i18n-label="テンポ" title="テンポ" data-i18n-title="テンポ"> <span class="unit">BPM</span></label>
          <select id="subdivision" aria-label="1ステップの長さ" data-i18n-label="1ステップの長さ" title="1ステップの長さ" data-i18n-title="1ステップの長さ"><option value="1" data-i18n="4分音符">4分音符</option><option value="2" data-i18n="8分音符">8分音符</option><option value="4" selected data-i18n="16分音符">16分音符</option><option value="8" data-i18n="32分音符">32分音符</option><option value="3" data-i18n="8分三連符">8分三連符</option><option value="6" data-i18n="16分三連符">16分三連符</option><option value="12" data-i18n="32分三連符">32分三連符</option></select>
          <div class="export-actions"><button id="copyText" class="button" aria-label="テキストでコピー" data-i18n-label="テキストでコピー" title="StepScore形式のテキストでコピー" data-i18n-title="StepScore形式のテキストでコピー" data-i18n="テキストでコピー">テキストでコピー</button><button id="save" class="button" popovertarget="saveMenu" aria-haspopup="menu" aria-expanded="false" aria-label="書き出す" data-i18n-label="書き出す" title="書き出す" data-i18n-title="書き出す" data-i18n="書き出す ▾">書き出す ▾</button></div>
          <div id="saveMenu" class="save-menu" popover role="menu" aria-label="保存形式" data-i18n-label="保存形式"><button id="export" class="button" role="menuitem" aria-label="TXT保存" data-i18n-label="TXT保存">TXT</button><button id="exportMidi" class="button" role="menuitem" aria-label="MIDI保存" data-i18n-label="MIDI保存">MIDI</button><button id="exportMp3" class="button" role="menuitem" aria-label="MP3保存" data-i18n-label="MP3保存">MP3</button><button id="exportOgg" class="button" role="menuitem" aria-label="OGG保存" data-i18n-label="OGG保存">OGG</button></div>
        </div>
        <div class="instrument-toolbar"><label><span data-i18n="楽器">楽器</span><select id="instrument" data-i18n-label="楽器"></select></label><label><span data-i18n="音源">音源</span><select id="soundset" data-i18n-label="音源"></select></label><label><input id="showAll" type="checkbox"><span data-i18n="全88鍵を表示">全88鍵を表示</span></label><select id="language" aria-label="Language / 言語"><option value="ja">日本語</option><option value="en">English</option></select><button id="cancelImport" class="button" hidden data-i18n="取り込みを中止">取り込みを中止</button></div>
        <section id="midiPanel" class="midi-panel" hidden><details id="midiTracks"><summary id="trackSummary" data-i18n="トラック">トラック</summary><div class="track-actions"><button id="selectMelodic" class="button subtle" data-i18n="打楽器以外を選択">打楽器以外を選択</button><button id="clearTracks" class="button subtle" data-i18n="すべて外す">すべて外す</button></div><div id="trackList" class="track-list"></div></details><label for="transpose"><span data-i18n="音の高さ">音の高さ</span> <input id="transpose" type="number" min="-24" max="24" step="1" value="0" title="0＝原曲の高さ" data-i18n-title="0＝原曲の高さ"> <span data-i18n="半音">半音</span></label><button id="suggest" class="button subtle" data-i18n="おすすめ">おすすめ</button></section>
        <section id="unsupportedPanel" class="unsupported-panel" hidden><p id="exportWarning" class="warning" hidden></p><button id="removeUnsupported" class="button danger" data-i18n="非対応の音を削除">非対応の音を削除</button></section>
        <div id="rollViewport" class="roll-viewport"><div id="roll" class="roll" role="grid" aria-label="音とステップの編集マス目" data-i18n-label="音とステップの編集マス目" aria-multiselectable="true" title="Shift＋クリック：選択、ドラッグ：選択・移動" data-i18n-title="noteEditHint"></div><div id="selectionBox" class="selection-box" aria-hidden="true" hidden></div></div>
        <div class="editor-footer"><span id="noteStats"></span><div><button id="deleteRange" class="button" disabled title="Delete / Backspace" aria-keyshortcuts="Delete Backspace" data-i18n="削除">削除</button> <button id="collapseRange" class="button" disabled title="Shift + Delete / Backspace" aria-keyshortcuts="Shift+Delete Shift+Backspace" data-i18n="削除して詰める">削除して詰める</button></div><div><button id="shrink" class="button subtle" title="末尾の1ステップを削除" data-i18n-title="末尾の1ステップを削除" data-i18n="−1ステップ">−1ステップ</button> <button id="extend" class="button subtle" data-i18n="＋4ステップ">＋4ステップ</button></div></div>
        <details id="txtPreviewPanel" class="preview-panel"><summary data-i18n="TXTプレビュー">TXTプレビュー</summary><div class="preview-content">
          <textarea id="txtPreview" readonly spellcheck="false" aria-label="出力テキストのプレビュー" data-i18n-label="出力テキストのプレビュー"></textarea>
        </div></details>
        <p id="errorMessage" class="error-message" role="alert"></p>
      </section>
  </main>
  <footer class="site-footer"><a href="https://markn2000.com/" target="_blank" rel="noopener" aria-label="MarkNのホームページ" data-i18n-label="MarkNのホームページ">markn2000.com</a><span><span data-i18n="footerLicense">音源・サンプル楽譜</span> <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0</a> · <a href="https://github.com/MarkN2000/musicbox/blob/main/LICENSES.md" target="_blank" rel="noopener" aria-label="ライセンスの詳細" data-i18n-label="ライセンスの詳細" data-i18n="詳細">詳細</a></span></footer>
  <script type="module" src="app.js?v=739f9b9a746388ea"></script>
</body>
</html>
