<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>オルゴール譜 — 30音の楽譜エディター</title>
  <meta name="description" content="MIDI・TXTを取り込み、30音オルゴールの楽譜をマス目で編集。試聴してTXT・MIDI・MP3・OGGで保存できます。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23163e57'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h16' stroke='%23ffffff' stroke-width='2'/%3E%3Crect x='10' y='6' width='5' height='6' fill='%2391d8f6'/%3E%3Crect x='19' y='13' width='5' height='6' fill='%2391d8f6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=613d5db0266c4610">
</head>
<body>
  <main>
      <section class="editor" id="dropZone" aria-label="楽譜エディター">
        <div class="editor-heading"><h1><input id="scoreTitle" type="text" value="新しい楽譜" aria-label="曲名" title="クリックして曲名を編集" maxlength="100" autocomplete="off" spellcheck="false"></h1><div class="heading-actions"><select id="templateSelect" aria-label="曲を選ぶ"><option value="">曲を選ぶ</option></select><button id="pickFile" class="button" title="MIDI・TXTを読み込む（ドラッグ＆ドロップも可）">MIDI / TXT</button><input id="fileInput" type="file" accept=".mid,.midi,.txt,audio/midi,audio/x-midi,text/plain" hidden><button id="reset" class="button subtle" title="空の楽譜に戻す">リセット</button></div></div>
        <div class="toolbar">
          <div class="playback-actions"><button id="play" class="button primary" aria-label="試聴" title="試聴" aria-pressed="false">▶</button><button id="loop" class="button" aria-label="ループ再生" title="ループ再生" aria-pressed="false">↻</button></div>
          <label><input id="bpm" type="number" min="20" max="300" value="120" aria-label="テンポ" title="テンポ"> <span class="unit">BPM</span></label>
          <select id="subdivision" aria-label="1ステップの長さ" title="1ステップの長さ"><option value="1">4分音符</option><option value="2">8分音符</option><option value="4" selected>16分音符</option><option value="8">32分音符</option><option value="3">8分三連符</option><option value="6">16分三連符</option></select>
          <div class="export-actions"><button id="copyText" class="button" aria-label="テキストをコピー" title="コピー">コピー</button><button id="save" class="button" popovertarget="saveMenu" aria-haspopup="menu" aria-expanded="false" aria-label="保存形式を選ぶ" title="保存形式を選ぶ">保存 ▾</button></div>
          <div id="saveMenu" class="save-menu" popover role="menu" aria-label="保存形式"><button id="export" class="button" role="menuitem" aria-label="TXT保存">TXT</button><button id="exportMidi" class="button" role="menuitem" aria-label="MIDI保存">MIDI</button><button id="exportMp3" class="button" role="menuitem" aria-label="MP3保存">MP3</button><button id="exportOgg" class="button" role="menuitem" aria-label="OGG（Vorbis）保存">OGG（Vorbis）</button></div>
        </div>
        <section id="midiPanel" class="midi-panel" hidden><details id="midiTracks"><summary id="trackSummary">トラック</summary><div class="track-actions"><button id="selectMelodic" class="button subtle">打楽器以外を選択</button><button id="clearTracks" class="button subtle">すべて外す</button></div><div id="trackList" class="track-list"></div></details><label for="transpose">音の高さ <input id="transpose" type="number" min="-24" max="24" step="1" value="0" title="半音単位。0で原曲の高さに戻ります。"> 半音</label><button id="suggest" class="button subtle">おすすめ</button></section>
        <section id="unsupportedPanel" class="unsupported-panel" hidden><p id="exportWarning" class="warning" hidden></p><button id="removeUnsupported" class="button danger">まとめて省く</button></section>
        <div id="rollViewport" class="roll-viewport"><div id="roll" class="roll" role="grid" aria-label="音とステップの編集マス目" aria-multiselectable="true" title="クリックで入力・削除、空白をドラッグで範囲選択、音をドラッグで移動。Shiftで選択を追加。"></div><div id="selectionBox" class="selection-box" aria-hidden="true" hidden></div></div>
        <div class="editor-footer"><span id="noteStats"></span><div><button id="shrink" class="button subtle" title="末尾の1ステップを削除">−1ステップ</button> <button id="extend" class="button subtle">＋4ステップ</button></div></div>
        <details id="txtPreviewPanel" class="preview-panel"><summary>TXTプレビュー</summary><div class="preview-content">
          <textarea id="txtPreview" readonly spellcheck="false" aria-label="出力テキストのプレビュー"></textarea>
        </div></details>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
  </main>
  <footer class="site-footer"><a href="https://markn2000.com/" target="_blank" rel="noopener" aria-label="MarkNのホームページ">markn2000.com</a><span>音源・サンプル楽譜 <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0</a> · <a href="https://github.com/MarkN2000/musicbox/blob/main/LICENSES.md" target="_blank" rel="noopener" aria-label="ライセンスの詳細">詳細</a></span></footer>
  <script src="vendor/midi.js"></script><script type="module" src="app.js?v=01e82e8fcb28047e&templates=7ec11e473ca69d4c&ui=c68d0fa61035cbbe"></script>
</body>
</html>
