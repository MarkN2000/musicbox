<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>オルゴール譜 — 30音の楽譜エディター</title>
  <meta name="description" content="MIDIを取り込み、30音オルゴールの楽譜をマス目で編集。試聴してTXT形式で書き出せます。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23163e57'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h16' stroke='%23ffffff' stroke-width='2'/%3E%3Crect x='10' y='6' width='5' height='6' fill='%2391d8f6'/%3E%3Crect x='19' y='13' width='5' height='6' fill='%2391d8f6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=5e4fc953dc603fc4">
</head>
<body>
  <main>
      <section class="editor" id="dropZone" aria-label="楽譜エディター">
        <div class="editor-heading"><h1 id="scoreTitle">楽譜</h1><div class="heading-actions"><select id="templateSelect" aria-label="曲を選ぶ"><option value="">曲を選ぶ</option></select><button id="pickFile" class="button">MIDI</button><input id="fileInput" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" hidden><button id="reset" class="button subtle" title="空の楽譜に戻す">リセット</button></div></div>
        <div class="toolbar">
          <button id="play" class="button primary" aria-pressed="false">▶ 試聴</button>
          <label>テンポ <input id="bpm" type="number" min="20" max="300" value="120"> <span class="unit">BPM</span></label>
          <label>1ステップ <select id="subdivision"><option value="1">4分音符</option><option value="2">8分音符</option><option value="4" selected>16分音符</option><option value="8">32分音符</option><option value="3">8分三連符</option><option value="6">16分三連符</option></select></label>
          <div class="export-actions"><button id="export" class="button">TXT保存</button><button id="copyText" class="button subtle">コピー</button></div>
        </div>
        <section id="midiPanel" class="midi-panel" hidden><details id="midiTracks"><summary id="trackSummary">トラック</summary><div class="track-actions"><button id="selectMelodic" class="button subtle">打楽器以外を選択</button><button id="clearTracks" class="button subtle">すべて外す</button></div><div id="trackList" class="track-list"></div></details><label for="transpose">音の高さ <input id="transpose" type="number" min="-24" max="24" step="1" value="0" title="半音単位。0で原曲の高さに戻ります。"> 半音</label><button id="suggest" class="button subtle">おすすめ</button></section>
        <section id="unsupportedPanel" class="unsupported-panel" hidden><p id="exportWarning" class="warning" hidden></p><button id="removeUnsupported" class="button danger">まとめて省く</button></section>
        <div id="rollViewport" class="roll-viewport"><div id="roll" class="roll" role="grid" aria-label="音とステップの編集マス目"></div></div>
        <div class="editor-footer"><span id="noteStats"></span><div><button id="shrink" class="button subtle" title="末尾の4ステップを削除">−4ステップ</button> <button id="extend" class="button subtle">＋4ステップ</button></div></div>
        <details id="settings" class="settings"><summary>設定</summary><div class="settings-content">
          <div class="settings-fields"><label><input id="loop" type="checkbox"> ループ再生</label><label>間隔 <input id="interval" type="number" min="10" max="5000" step="1" value="125"> <span class="unit">ms</span></label><label for="fileName">ファイル名 <span class="filename"><input id="fileName" value="music-box" maxlength="100"><span>.txt</span></span></label></div>
          <p class="template-info" id="templateInfo"><span id="templateDetails"></span><a id="templateSource" target="_blank" rel="noopener noreferrer">出典 ↗</a><a id="templateListen" target="_blank" rel="noopener noreferrer">原曲を聴く ↗</a><span id="templateCredit" hidden></span><a id="templateLicense" target="_blank" rel="noopener noreferrer" hidden></a></p>
          <label class="preview-heading" for="txtPreview">TXTプレビュー</label><textarea id="txtPreview" readonly spellcheck="false" aria-label="出力テキストのプレビュー"></textarea>
        </div></details>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
  </main>
  <script src="vendor/midi.js"></script><script type="module" src="app.js?v=01e82e8fcb28047e&templates=16b7925fc7621094&ui=dc45cd552dd10df9"></script>
</body>
</html>
